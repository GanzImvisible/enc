<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>🔒 File Crypto Tool</title>
  <link rel="stylesheet" href="style.css">

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

<h1>🔒 File Crypto Tool (Web)</h1>

<div class="box">
  <label>Algoritma:</label>
  <select id="algo">
    <option value="AES">AES</option>
    <option value="Base64">Base64</option>
    <option value="MD5">MD5</option>
  </select>

  <input type="password" id="password" placeholder="Password (AES saja)" />

  <hr>

  <input type="file" id="fileInput" multiple webkitdirectory />

  <div class="buttons">
    <button onclick="encrypt()">🔐 Enkripsi</button>
    <button onclick="decrypt()">🔓 Dekripsi</button>
    <button onclick="hashFile()">🔍 Hash MD5</button>
  </div>
</div>

<pre id="log"></pre>

<script src="script.js"></script>
</body>
</html>
